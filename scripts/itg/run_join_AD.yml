---

- hosts: managed_sas_hosts
  gather_facts: false

  # The variables you would most likely want/need to override have been included
  vars:

    # Active Directory
    client_join_state: joined
    client_domain: itg-internal.com
    client_username: administrator
    client_password: Admin123
    # client_keytab: /tmp/1id/admin.keytab

    # Facts
    client_join_facts_generate: true
    client_join_facts_verbose: false

    # Reports
    client_join_reports_generate: true 
    client_join_reports_backup: true
    client_join_reports_generate: awx-itg
    client_join_reports: 
    - src:  client_join_report.csv.j2   
      dest: /home/reports/sas/client_join_report.csv
    - src:  client_join_report.html.j2
      dest: /home/reports/sas/client_join_report.html

  roles:
    - name: oneidentity.authentication_services.client_join
