---

- hosts: all
  gather_facts: false

  # The variables you would most likely want/need to override have been included
  vars:

    # Active Directory
    client_domain: itg-internal.com
    client_username: administrator
    client_password: Admin123

    # Report parameters
    unix_computers_in_ad_base_container: 'CN=Computers,DC=itg-internal,DC=com'

    # Reports
    unix_computers_in_ad_reports_generate: true
    unix_computers_in_ad_reports_backup: true
    unix_computers_in_ad_reports_host: 192.168.0.123
    unix_computers_in_ad_reports:
    - src:  unix_computers_in_ad_report.csv.j2
      dest: /home/reports/unix_computers_in_ad_report.csv
    - src:  unix_computers_in_ad_report.html.j2
      dest: /home/reports/unix_computers_in_ad_report.html
    

  roles:
    - name: oneidentity.authentication_services.unix_computers_in_ad
